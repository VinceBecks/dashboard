projects:
  - project-name: foo-projekt
    namespace-labels:
      mycomp.de/is-feature-environment: true
      mycomp.de/project-name: foo-projekt
      mycomp.de/organization-unit: development
    # Aufteilung der Anwendungs-Services im Dashboard. Ein Service gehört zu einem Bereich, wenn er alle Labels
    # mindestens einer label-combination trägt. Nicht zugeordnete Services landen im Bereich "others".
    others-area-label: Andere  # optional, Standard "Andere"
    service-areas:
      - &business-area
        area-name: business-services
        area-label: Business
        label-combinations:
          - app.kubernetes.io/part-of: shop
            app.kubernetes.io/component: backend
          - app.kubernetes.io/part-of: billing
      - area-name: infrastructure-services
        area-label: Infrastruktur
        label-combinations:
          - app.kubernetes.io/part-of: rabbitmq
          - app.kubernetes.io/part-of: database
  - project-name: bar-projekt
    namespace-labels:
      mycomp.de/is-feature-environment: true
      mycomp.de/project-name: bar
      mycomp.de/organization-unit: operations
    service-areas:
      - *business-area  # YAML-Anker: gleicher Bereich wie bei foo-projekt

actionHandlers:
  - action-name: delete-pod
    enabled: true
    action-title: Pod Löschen
    lucide-icon: trash
    lucide-icon-color: red
    extra-handler-configs:
      force-delete: true
  - action-name: node-port-service-on-service-base
    enabled: true
    action-title: NodePort-Service erstellen
    lucide-icon: network
    lucide-icon-color: blue
  - action-name: delete-node-port-service
    enabled: true
    action-title: NodePort-Service löschen
    lucide-icon: trash-2
    lucide-icon-color: red
  - action-name: restart-service-replicas
    enabled: true
    action-title: Alle Replika löschen (Neustart)
    lucide-icon: rotate-ccw
    lucide-icon-color: orange

  # Beispiel für den Handler-Typ gitlab-pipeline: beliebig viele Aktionen können ihn nutzen.
  # Auskommentiert, weil das Backend ohne gesetzte Token-Variable nicht startet.
  # - action-name: deploy-feature
  #   handler: gitlab-pipeline
  #   enabled: true
  #   action-title: Feature deployen
  #   lucide-icon: rocket
  #   lucide-icon-color: green
  #   extra-handler-configs:
  #     gitlab-url: https://gitlab.mycomp.de
  #     project: team/foo-deploy            # Projekt-ID oder Pfad
  #     ref: main                           # Template erlaubt, z. B. "feature/{{ .Namespace }}"
  #     token-env: GITLAB_TRIGGER_TOKEN_FOO # Name der Env-Variable mit dem Pipeline-Trigger-Token
  #     applies-to: [namespace]             # namespace | service | ingress | pod
  #     projects: [foo-projekt]             # optional: nur für diese Dashboard-Projekte
  #     timeout: 15s                        # optional, Standard 10s
  #     variables:
  #       NAMESPACE: "{{ .Namespace }}"
  #       ACTION: deploy

store:
  recreate-store-interval: 1h
