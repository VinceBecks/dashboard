openapi: 3.0.3
info:
  title: Feature-Dashboard API
  version: 2.0.0
  description: |
    API des Feature-Environment-Dashboards. Das Frontend öffnet `GET /api/events` (Server-Sent Events),
    erhält zuerst die komplette Hierarchie Projekt → Namespace → Services (→ Pods) / Ingresses und danach
    nur noch Änderungen. Aktionen werden über `PATCH /api/actions/{action}` ausgelöst.

    Ein Beispiel des Initialstands liegt in `backend/internal/api/example-api.jsonc`.
paths:
  /api/events:
    get:
      summary: Event-Stream mit Initialstand und Änderungen
      description: |
        `text/event-stream`. Jedes Event hat eine je Verbindung fortlaufende `id`, einen Typ (`event:`) und
        einzeiliges JSON (`data:`). Alle 25 s kommt ein Kommentar `: ping`.

        | Event      | data                                    | Bedeutung |
        |------------|-----------------------------------------|-----------|
        | `snapshot` | `Snapshot`                              | Immer das erste Event: kompletter Stand |
        | `upsert`   | `NamespaceObject`, `ServiceObject`, `NodePortServiceObject`, `PodObject` oder `IngressObject` (ohne Kind-Listen) | Objekt neu oder geändert; vorhandene Kinder bleiben |
        | `delete`   | `DeleteEvent`                           | Objekt samt aller Kinder entfernen |

        - `upsert` kommt Parent vor Kind, `delete` Kind vor Parent. Wird ein Parent gelöscht, entfällt das
          `delete` für seine Kinder.
        - Objekte werden über `kind`, `parents` und `name` identifiziert. Wechselt ein Namespace das Projekt,
          kommt `delete` im alten und `upsert` im neuen Projekt.
        - `Last-Event-ID` wird ignoriert; nach einem Reconnect kommt wieder ein `snapshot`.
        - Ist ein Client zu langsam, beendet der Server den Stream; der Client verbindet sich neu.
      responses:
        '200':
          description: Event-Stream
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                id: 1
                event: snapshot
                data: {"projects":[{"name":"foo-projekt","namespaces":[]}]}

                id: 2
                event: delete
                data: {"kind":"namespace","name":"foo-feature-123","parents":{"project":"foo-projekt"}}
        '503':
          description: Store wird noch aufgebaut oder Server fährt herunter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/actions/{action}:
    patch:
      summary: Aktion auf einem Objekt ausführen
      description: |
        Führt die Aktion aus. Änderungen am Cluster erscheinen erst über die Informer-Events im Store
        und kommen dann als Events über `GET /api/events`.
      parameters:
        - { name: action, in: path, required: true, description: Aktion-ID, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRequest' }
      responses:
        '200':
          description: Aktion wurde ausgeführt; `success` zeigt, ob sie erfolgreich war.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '400':
          description: Ungültiger Request, Aktion nicht anwendbar oder ungültige Eingaben
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktion unbekannt/deaktiviert oder Objekt nicht gefunden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /healthz:
    get:
      summary: Liveness
      responses:
        '200': { description: Prozess läuft }
  /readyz:
    get:
      summary: Readiness
      responses:
        '200': { description: Store ist initial befüllt }
        '503': { description: Store wird noch aufgebaut }
  /api/openapi.yaml:
    get:
      summary: Diese Spezifikation
      responses:
        '200': { description: OpenAPI-Spezifikation }
  /api/swagger:
    get:
      summary: Swagger-UI
      responses:
        '200': { description: HTML-Seite }
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        problems:
          type: array
          items: { type: string }
          description: Einzelne Validierungsfehler der Formular-Eingaben
    Action:
      type: object
      required: [id, title, lucideIcon, lucideIconColor]
      properties:
        id: { type: string, description: Eindeutige Aktion-ID }
        title: { type: string }
        lucideIcon: { type: string }
        lucideIconColor: { type: string }
        formFields:
          type: array
          items: { $ref: '#/components/schemas/FormField' }
    FormField:
      type: object
      required: [id, label, type, isRequired]
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, select, multi-select, number] }
        isRequired: { type: boolean }
        description: { type: string }
        options:
          type: array
          description: Nur bei select und multi-select
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
    Link:
      type: object
      description: Konfigurierter Absprung (links in der config.yaml); die URL rendert das Backend je Objekt.
      required: [id, title, lucideIcon, lucideIconColor, url]
      properties:
        id: { type: string }
        title: { type: string }
        lucideIcon: { type: string }
        lucideIconColor: { type: string }
        url: { type: string, format: uri, description: Absolute http(s)-URL }
    Parents:
      type: object
      description: |
        Einordnung in die Hierarchie. Namespace: `project`; Service und Ingress: `project`, `namespace`;
        Pod: `project`, `namespace`, `service`. Ein Pod, den mehrere Services referenzieren, erscheint unter jedem.
      required: [project]
      properties:
        project: { type: string }
        namespace: { type: string }
        service: { type: string }
    DeleteEvent:
      type: object
      required: [kind, name, parents]
      properties:
        kind: { type: string, enum: [namespace, service, node-port-service, ingress, pod] }
        name: { type: string }
        parents: { $ref: '#/components/schemas/Parents' }
    ObjectBase:
      type: object
      required: [kind, name, parents, actions, links]
      properties:
        kind: { type: string, enum: [namespace, service, node-port-service, ingress, pod] }
        name: { type: string }
        parents: { $ref: '#/components/schemas/Parents' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }
    NamespaceObject:
      description: Feature-Umgebung. `services`, `nodePortServices` und `ingresses` nur im Snapshot.
      allOf:
        - $ref: '#/components/schemas/ObjectBase'
        - type: object
          properties:
            services:
              type: array
              items: { $ref: '#/components/schemas/ServiceObject' }
            nodePortServices:
              type: array
              items: { $ref: '#/components/schemas/NodePortServiceObject' }
            ingresses:
              type: array
              items: { $ref: '#/components/schemas/IngressObject' }
    ServiceObject:
      description: Anwendungs-Service (nur Typ ClusterIP). `pods` nur im Snapshot, sortiert nach Name.
      allOf:
        - $ref: '#/components/schemas/ObjectBase'
        - type: object
          required: [running, areas]
          properties:
            running: { type: boolean, description: Mindestens ein Replica ist ready }
            areas:
              type: array
              description: |
                IDs der Service-Bereiche (`Snapshot.projects[].serviceAreas`), zu denen der Service gehört; mindestens
                einer, ohne passenden Bereich `others`.
              items: { type: string }
            pods:
              type: array
              items: { $ref: '#/components/schemas/PodObject' }
    NodePortServiceObject:
      description: |
        Service vom Typ NodePort (`kind: node-port-service`). Für `PATCH /api/actions` ist er ein Objekt vom Typ
        `service`.
      allOf:
        - $ref: '#/components/schemas/ObjectBase'
        - type: object
          required: [addresses]
          properties:
            addresses:
              type: array
              description: Je Port mit NodePort `<cluster.dns-name>:<node-port>`, Reihenfolge der Spec.
              items: { type: string, example: 'k8s-nodes.mycomp.de:30080' }
    PodObject:
      description: Replica eines Services.
      allOf:
        - $ref: '#/components/schemas/ObjectBase'
        - type: object
          required: [ready, containers]
          properties:
            ready: { type: boolean }
            containers:
              type: array
              items:
                type: object
                required: [name, image]
                properties:
                  name: { type: string }
                  image: { type: string }
    IngressObject:
      allOf:
        - $ref: '#/components/schemas/ObjectBase'
        - type: object
          required: [urls]
          properties:
            urls:
              type: array
              description: |
                Je Rule mit Host und je Path `https://<host><path>` (Reihenfolge der Spec, ohne Duplikate);
                Rules ohne Host fehlen.
              items: { type: string, format: uri }
    ServiceArea:
      type: object
      required: [id, label]
      properties:
        id: { type: string, description: '`area-name` aus der config.yaml oder `others`' }
        label: { type: string }
    Snapshot:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          description: Alle Projekte in der Reihenfolge der config.yaml, auch ohne Namespaces.
          items:
            type: object
            required: [name, serviceAreas, namespaces]
            properties:
              name: { type: string }
              serviceAreas:
                type: array
                description: |
                  Service-Bereiche des Projekts (`service-areas` der config.yaml) in Config-Reihenfolge, `others`
                  immer zuletzt. Im Dashboard je ein Reiter der Namespace-Kachel. Statisch, es gibt dafür keine Events.
                items: { $ref: '#/components/schemas/ServiceArea' }
              namespaces:
                type: array
                description: Sortiert nach Name; darin Services, Ingresses und Pods ebenfalls nach Name.
                items: { $ref: '#/components/schemas/NamespaceObject' }
    ActionRequest:
      type: object
      required: [object]
      properties:
        object:
          type: object
          required: [kind, name]
          properties:
            kind: { type: string, enum: [namespace, service, ingress, pod] }
            namespace: { type: string, description: Bei kind=namespace optional }
            name: { type: string }
        inputs:
          type: object
          description: Werte der Formular-Felder, Schlüssel = Feld-ID
          additionalProperties: true
    ActionResult:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
