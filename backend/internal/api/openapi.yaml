openapi: 3.0.3
info:
  title: Feature-Dashboard API
  version: 1.0.0
  description: |
    API des Feature-Environment-Dashboards. Liefert Projekte, deren Feature-Umgebungen (Namespaces)
    und die darin laufenden Objekte samt ausführbarer Aktionen.

    GET-Endpunkte liefern einen `ETag`. Sendet das Frontend diesen als `If-None-Match` mit und hat sich
    nichts geändert, antwortet der Server mit `304 Not Modified` ohne Body.
paths:
  /api/cluster:
    get:
      summary: Statische Angaben zum Cluster
      description: Werte aus der config.yaml (Abschnitt cluster); sie ändern sich erst mit einem Neustart des Backends.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Aktuelle Daten
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterResponse' }
        '304': { $ref: '#/components/responses/NotModified' }
  /api/polling:
    get:
      summary: Abfrage-Vorgaben für das Frontend
      description: |
        Wählbare Abfrage-Intervalle, Default und Sperrzeit des Aktualisieren-Buttons aus der config.yaml (Abschnitt
        frontend); sie ändern sich erst mit einem Neustart des Backends. Ein Intervall mit 0 Millisekunden heißt:
        nicht automatisch abfragen, nur per Aktualisieren-Button.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Aktuelle Daten
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollingResponse' }
        '304': { $ref: '#/components/responses/NotModified' }
  /api/projects:
    get:
      summary: Projekte und ihre Namespaces
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Aktuelle Daten
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectsResponse' }
        '304': { $ref: '#/components/responses/NotModified' }
  /api/projects/{project}/namespaces/{namespace}:
    get:
      summary: Alle Objekte eines Namespaces (inkl. Namespace selbst)
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Aktuelle Daten
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamespaceResponse' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/Error' }
  /api/actions/{action}:
    patch:
      summary: Aktion auf einem Objekt ausführen
      description: |
        Führt die Aktion aus. Änderungen am Cluster erscheinen erst über die Informer-Events im Store,
        also mit dem nächsten Abruf der GET-Endpunkte.
      parameters:
        - { name: action, in: path, required: true, description: Aktion-ID, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRequest' }
      responses:
        '200':
          description: Aktion wurde ausgeführt; `success` zeigt, ob sie erfolgreich war.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '400':
          description: Ungültiger Request, Aktion nicht anwendbar oder ungültige Eingaben
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktion unbekannt/deaktiviert oder Objekt nicht gefunden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /healthz:
    get:
      summary: Liveness
      responses:
        '200': { description: Prozess läuft }
  /readyz:
    get:
      summary: Readiness
      responses:
        '200': { description: Store ist initial befüllt }
        '503': { description: Store wird noch aufgebaut }
  /api/openapi.yaml:
    get:
      summary: Diese Spezifikation
      responses:
        '200': { description: OpenAPI-Spezifikation }
  /api/swagger:
    get:
      summary: Swagger-UI
      responses:
        '200': { description: HTML-Seite }
components:
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Zuletzt erhaltener ETag
      schema: { type: string }
  headers:
    ETag:
      description: Zeitstempel der letzten relevanten Änderung
      schema: { type: string }
  responses:
    NotModified:
      description: Frontend ist bereits auf dem aktuellen Stand
    Error:
      description: Fehler
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        problems:
          type: array
          items: { type: string }
          description: Einzelne Validierungsfehler der Formular-Eingaben
    StringMap:
      type: object
      additionalProperties: { type: string }
    Action:
      type: object
      required: [id, title, lucideIcon, lucideIconColor]
      properties:
        id: { type: string, description: Eindeutige Aktion-ID }
        title: { type: string }
        lucideIcon: { type: string }
        lucideIconColor: { type: string }
        formFields:
          type: array
          items: { $ref: '#/components/schemas/FormField' }
    FormField:
      type: object
      required: [id, label, type, isRequired]
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, select, multi-select, number] }
        isRequired: { type: boolean }
        description: { type: string }
        options:
          type: array
          description: Nur bei select und multi-select
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
    Link:
      type: object
      description: Konfigurierter Absprung (links in der config.yaml); die URL rendert das Backend je Objekt.
      required: [id, title, lucideIcon, lucideIconColor, url]
      properties:
        id: { type: string }
        title: { type: string }
        lucideIcon: { type: string }
        lucideIconColor: { type: string }
        url: { type: string, format: uri, description: Absolute http(s)-URL }
    ObjectBase:
      type: object
      required: [name, actions, links]
      properties:
        name: { type: string }
        namespace: { type: string }
        labels: { $ref: '#/components/schemas/StringMap' }
        annotations: { $ref: '#/components/schemas/StringMap' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }
    Namespace:
      allOf:
        - $ref: '#/components/schemas/ObjectBase'
        - type: object
          required: [project]
          properties:
            project: { type: string }
    Pod:
      allOf:
        - $ref: '#/components/schemas/ObjectBase'
        - type: object
          required: [phase, ready, containers]
          properties:
            phase: { type: string, example: Running }
            ready: { type: boolean }
            containers:
              type: array
              items:
                type: object
                required: [name, image]
                properties:
                  name: { type: string }
                  image: { type: string }
                  ports:
                    type: array
                    items:
                      type: object
                      required: [containerPort]
                      properties:
                        name: { type: string }
                        containerPort: { type: integer, format: int32 }
                        protocol: { type: string }
    Service:
      allOf:
        - $ref: '#/components/schemas/ObjectBase'
        - type: object
          required: [type, ports, replicas]
          properties:
            type: { type: string, example: ClusterIP }
            selector: { $ref: '#/components/schemas/StringMap' }
            replicas:
              type: array
              description: Namen der Pods, die der Service referenziert
              items: { type: string }
            ports:
              type: array
              items:
                type: object
                required: [port, targetPort]
                properties:
                  name: { type: string }
                  protocol: { type: string }
                  port: { type: integer, format: int32 }
                  targetPort: { type: string, description: Rohwert (Name oder Zahl) }
                  resolvedTargetPort: { type: integer, format: int32, description: Aufgelöste Port-Nummer }
                  nodePort: { type: integer, format: int32 }
    Ingress:
      allOf:
        - $ref: '#/components/schemas/ObjectBase'
        - type: object
          required: [rules]
          properties:
            rules:
              type: array
              items:
                type: object
                required: [host, paths]
                properties:
                  host: { type: string }
                  paths:
                    type: array
                    items:
                      type: object
                      required: [pathType, path, backend]
                      properties:
                        pathType: { type: string }
                        path: { type: string }
                        backend:
                          type: object
                          required: [serviceName]
                          properties:
                            serviceName: { type: string }
                            servicePortName: { type: string }
                            servicePortNumber: { type: integer, format: int32 }
                            resolvedServicePortNumber: { type: integer, format: int32 }
    ClusterResponse:
      type: object
      required: [dnsName]
      properties:
        dnsName:
          type: string
          description: DNS-Name (oder IP) der Nodes für alle NodePort-Services (<dnsName>:<nodePort>); leer, wenn nicht konfiguriert.
    PollingResponse:
      type: object
      required: [intervals, defaultInterval, manualRefreshCooldownMilliseconds]
      properties:
        intervals:
          type: array
          description: Im Frontend wählbare Abfrage-Intervalle in der Reihenfolge der config.yaml.
          items: { $ref: '#/components/schemas/PollingInterval' }
        defaultInterval:
          type: string
          description: value des Intervalls, das nach dem Laden des Frontends gilt.
          example: 10s
        manualRefreshCooldownMilliseconds:
          type: integer
          format: int64
          description: So lange ist der Aktualisieren-Button nach einem Klick gesperrt.
          example: 3000
    PollingInterval:
      type: object
      required: [value, milliseconds]
      properties:
        value:
          type: string
          description: Wert aus der config.yaml (Go-Dauer), dient als Anzeige und ID.
          example: 10s
        milliseconds:
          type: integer
          format: int64
          description: Intervall in Millisekunden; 0 heißt nur manuell aktualisieren.
          example: 10000
    ProjectsResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            type: object
            required: [name, namespaces]
            properties:
              name: { type: string }
              namespaces:
                type: array
                items: { $ref: '#/components/schemas/Namespace' }
    NamespaceResponse:
      type: object
      required: [namespace, services, ingresses, pods, serviceAreas]
      properties:
        namespace: { $ref: '#/components/schemas/Namespace' }
        serviceAreas:
          type: array
          description: |
            Aufteilung der Anwendungs-Services (Typ ClusterIP) in Bereiche gemäß service-areas der config.yaml.
            Konfigurierte Bereiche kommen in Config-Reihenfolge (auch leer), zuletzt der Bereich `others` mit allen
            nicht zugeordneten Services. `others` fehlt, wenn er leer ist und Bereiche konfiguriert sind.
            Ein Service kann in mehreren Bereichen vorkommen.
          items: { $ref: '#/components/schemas/ServiceArea' }
        services:
          type: array
          items: { $ref: '#/components/schemas/Service' }
        ingresses:
          type: array
          items: { $ref: '#/components/schemas/Ingress' }
        pods:
          type: array
          items: { $ref: '#/components/schemas/Pod' }
    ServiceArea:
      type: object
      required: [id, label, services]
      properties:
        id: { type: string, description: 'area-name aus der config.yaml bzw. "others"' }
        label: { type: string }
        services:
          type: array
          description: Namen der Services aus `services`, sortiert nach Name
          items: { type: string }
    ActionRequest:
      type: object
      required: [object]
      properties:
        object:
          type: object
          required: [kind, name]
          properties:
            kind: { type: string, enum: [namespace, service, ingress, pod] }
            namespace: { type: string, description: Bei kind=namespace optional }
            name: { type: string }
        inputs:
          type: object
          description: Werte der Formular-Felder, Schlüssel = Feld-ID
          additionalProperties: true
    ActionResult:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
