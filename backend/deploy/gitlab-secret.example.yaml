# Beispiel: Tokens für gitlab-pipeline- und deploy-missing-services-Aktionen.
# Jeder Schlüssel wird als Umgebungsvariable in den Backend-Container geladen (envFrom im Deployment)
# und in der config.yaml referenziert: Trigger-Token per token-env, Lese-Token (Scope read_api) per
# status-token-env. Echte Tokens nicht ins Repository committen.
apiVersion: v1
kind: Secret
metadata:
  name: feature-dashboard-gitlab
  namespace: feature-dashboard
type: Opaque
stringData:
  GITLAB_TRIGGER_TOKEN_FOO: "<pipeline-trigger-token>"
  GITLAB_READ_TOKEN_FOO: "<access-token-mit-read_api>"
