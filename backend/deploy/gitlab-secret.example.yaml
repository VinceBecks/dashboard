# Beispiel: Pipeline-Trigger-Tokens für gitlab-pipeline-Aktionen.
# Jeder Schlüssel wird als Umgebungsvariable in den Backend-Container geladen (envFrom im Deployment)
# und in der config.yaml per token-env referenziert. Echte Tokens nicht ins Repository committen.
apiVersion: v1
kind: Secret
metadata:
  name: feature-dashboard-gitlab
  namespace: feature-dashboard
type: Opaque
stringData:
  GITLAB_TRIGGER_TOKEN_FOO: "<pipeline-trigger-token>"
