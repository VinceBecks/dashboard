# Beispiel: Zugangsdaten für die s3-download-Aktion.
# Jeder Schlüssel wird als Umgebungsvariable in den Backend-Container geladen (envFrom im Deployment)
# und in der config.yaml per access-key-id-env bzw. secret-access-key-env referenziert.
# Echte Zugangsdaten nicht ins Repository committen.
apiVersion: v1
kind: Secret
metadata:
  name: feature-dashboard-s3
  namespace: feature-dashboard
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: "<secret-id>"
  S3_SECRET_ACCESS_KEY: "<secret-key>"
