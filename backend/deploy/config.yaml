apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-dashboard
  namespace: feature-dashboard
data:
  config.yaml: |
    projects:
      - project-name: foo-projekt
        namespace-labels:
          mycomp.de/is-feature-environment: true
          mycomp.de/project-name: foo-projekt
      - project-name: bar-projekt
        namespace-labels:
          mycomp.de/is-feature-environment: true
          mycomp.de/project-name: bar
      - project-name: foobar-projekt
        namespace-labels:
          mycomp.de/is-feature-environment: true
          mycomp.de/project-name: foobar
        link-variables-overrides:
          something: isNotHere
    actionHandlers:
      - action-name: delete-pod
        action-title: Pod Löschen
        lucide-icon: trash
        lucide-icon-color: red
        projects: [foo-projekt, bar-projekt, foobar-projekt]
        extra-handler-configs:
          force-delete: true
      - action-name: node-port-service-on-service-base
        action-title: NodePort-Service erstellen
        lucide-icon: network
        lucide-icon-color: blue
        projects: []  # NodePort-Services zeigt das Dashboard nicht mehr an
      - action-name: delete-node-port-service
        action-title: NodePort-Service löschen
        lucide-icon: trash-2
        lucide-icon-color: red
        projects: []  # NodePort-Services zeigt das Dashboard nicht mehr an
      - action-name: restart-service-replicas
        action-title: Alle Replika löschen (Neustart)
        lucide-icon: rotate-ccw
        lucide-icon-color: orange
        projects: [foo-projekt, bar-projekt, foobar-projekt]
    store:
      recreate-store-interval: 5m
    link-variables:
      demoUrl: http://localhost:8080
      something: isHere
    links:
      - link-id: test-kibana-logs
        title: Logs in Kibana
        lucide-icon: scroll-text
        lucide-icon-color: "#00bfb3"
        projects: [ foo-projekt, bar-projekt ]
        targets:
          namespace:
            url: |-
              {{ .Vars.demoUrl }}/namespaces/{{ .Name }}/{{ .Vars.something }}?foo={{ printf "hello world // bro" | urlquery }}
          service: # Logs aller Pods, die der Service selektiert
            url: |-
              {{ .Vars.demoUrl }}/namespaces/{{ .Namespace }}/services/{{ .Name }}/{{ .Vars.something }}?foo={{ printf "hello" }}
