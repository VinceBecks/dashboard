apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-dashboard
  namespace: feature-dashboard
data:
  config.yaml: |
    projects:
      - project-name: foo-projekt
        namespace-labels:
          mycomp.de/is-feature-environment: true
          mycomp.de/project-name: foo-projekt
        service-areas:
          - area-name: business-services
            area-label: Business
            label-combinations:
              - app.kubernetes.io/part-of: foo
          - area-name: infrastructure-services
            area-label: Infrastruktur
            label-combinations:
              - app.kubernetes.io/part-of: rabbitmq
              - app.kubernetes.io/part-of: database
      - project-name: bar-projekt
        namespace-labels:
          mycomp.de/is-feature-environment: true
          mycomp.de/project-name: bar
        service-areas:
          - area-name: business-services
            area-label: Business
            label-combinations:
              - app.kubernetes.io/part-of: bar
          - area-name: infrastructure-services
            area-label: Infrastruktur
            label-combinations:
              - app.kubernetes.io/part-of: database
      - project-name: foobar-projekt
        namespace-labels:
          mycomp.de/is-feature-environment: true
          mycomp.de/project-name: foobar
        service-areas:
          - area-name: business-services
            area-label: Business
            label-combinations:
              - app.kubernetes.io/part-of: foobar
          - area-name: infrastructure-services
            area-label: Infrastruktur
            label-combinations:
              - app.kubernetes.io/part-of: database
        link-variables-overrides:
          something: isNotHere
    actionHandlers:
      - action-name: delete-pod
        action-title: Pod Löschen
        lucide-icon: trash
        lucide-icon-color: red
        projects: [foo-projekt, bar-projekt, foobar-projekt]
        extra-handler-configs:
          force-delete: true
      - action-name: node-port-service-on-service-base
        action-title: NodePort-Service erstellen
        lucide-icon: network
        lucide-icon-color: blue
        projects: [foo-projekt, bar-projekt, foobar-projekt]
      - action-name: delete-node-port-service
        action-title: NodePort-Service löschen
        lucide-icon: trash-2
        lucide-icon-color: red
        projects: [foo-projekt, bar-projekt, foobar-projekt]
      - action-name: restart-service-replicas
        action-title: Alle Replika löschen (Neustart)
        lucide-icon: rotate-ccw
        lucide-icon-color: orange
        projects: [foo-projekt, bar-projekt, foobar-projekt]
      # Startet eine GitLab-Pipeline für den Namespace; Tokens aus dem Secret feature-dashboard-gitlab.
      - action-name: redeploy-namespace
        handler: gitlab-pipeline
        action-title: Feature-Umgebung neu deployen
        lucide-icon: rocket
        lucide-icon-color: green
        projects: [foo-projekt]
        extra-handler-configs:
          gitlab-url: https://gitlab.mycomp.de
          project: team/foo-deploy
          ref: main
          token-env: GITLAB_TRIGGER_TOKEN_FOO
          status-token-env: GITLAB_READ_TOKEN_FOO
          applies-to: [namespace]
          timeout: 15s
          variables:
            NAMESPACE: "{{ .Namespace }}"
            PROJECT: "{{ .Project }}"
            ORGANIZATION_UNIT: '{{ index .Labels "mycomp.de/organization-unit" }}'
            ACTION: redeploy
    copy-commands:
      - command-id: pod-shell                 # je Container ein Befehl, da das Template .Container nutzt
        title: Shell im Pod öffnen
        lucide-icon: terminal
        lucide-icon-color: "#455a64"
        projects: [foo-projekt, bar-projekt, foobar-projekt]
        targets:
          pod:
            command: kubectl exec -it -n {{ .Namespace }} {{ .Name }} -c {{ .Container }} -- sh
      - command-id: pod-logs
        title: Logs verfolgen
        lucide-icon: file-text
        lucide-icon-color: "#455a64"
        projects: [foo-projekt, bar-projekt, foobar-projekt]
        targets:
          pod:
            command: kubectl logs -f -n {{ .Namespace }} {{ .Name }} --all-containers
      - command-id: namespace-context
        title: Namespace im kubectl-Context setzen
        lucide-icon: square-terminal
        lucide-icon-color: "#455a64"
        projects: [foo-projekt, bar-projekt, foobar-projekt]
        targets:
          namespace:
            command: kubectl config set-context --current --namespace={{ .Namespace }}
    
    cluster:
      dns-name: k8s-nodes.mycomp.de.local   # Pflicht; DNS-Name oder IP der Nodes für <dns-name>:<node-port>
    pipelines: # Standardwerte; die ConfigMap legt das Backend selbst an
      configmap-name: feature-dashboard-pipelines
      poll-interval: 15s
    link-variables:
      demoUrl: http://localhost:8080
      something: isHere
    links:
      - link-id: test-kibana-logs
        title: Logs in Kibana
        lucide-icon: scroll-text
        lucide-icon-color: "#00bfb3"
        projects: [ foo-projekt, bar-projekt ]
        targets:
          namespace:
            url: |-
              {{ .Vars.demoUrl }}/namespaces/{{ .Name }}/{{ .Vars.something }}?foo={{ printf "hello world // bro" | urlquery }}
          service: # Logs aller Pods, die der Service selektiert
            url: |-
              {{ .Vars.demoUrl }}/namespaces/{{ .Namespace }}/services/{{ .Name }}/{{ .Vars.something }}?foo={{ printf "hello" }}
