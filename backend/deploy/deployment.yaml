apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-dashboard-backend
  namespace: feature-dashboard
spec:
  replicas: 1 # Immer genau ein Replica: einziger Schreiber der Pipeline-ConfigMap, ein Informer-Cache.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: feature-dashboard-backend
  template:
    metadata:
      labels:
        app: feature-dashboard-backend
    spec:
      serviceAccountName: feature-dashboard
      containers:
        - name: backend
          image: feature-dashboard-backend:1.0.0
          imagePullPolicy: IfNotPresent
          # Trigger-Tokens für gitlab-pipeline-Aktionen (token-env in der config.yaml), siehe gitlab-secret.example.yaml.
          envFrom:
            - secretRef:
                name: feature-dashboard-gitlab
                optional: true
            # Proxy und Company-CA (HTTPS_PROXY, NO_PROXY, SSL_CERT_DIR), siehe network.example.yaml.
            - configMapRef:
                name: feature-dashboard-network
                optional: true
          env:
            # Namespace der ConfigMap mit den laufenden Pipelines (pipelines.configmap-namespace).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          volumeMounts:
            - name: config
              mountPath: /etc/dashboard
            - name: company-ca
              mountPath: /etc/company-ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: feature-dashboard
        # Company-CA (PEM); ohne die ConfigMap bleibt das Verzeichnis leer und es gelten nur die System-CAs.
        - name: company-ca
          configMap:
            name: company-ca
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: feature-dashboard-backend
  namespace: feature-dashboard
spec:
  selector:
    app: feature-dashboard-backend
  ports:
    - name: http
      port: 80
      targetPort: http
