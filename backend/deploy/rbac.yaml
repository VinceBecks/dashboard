apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-dashboard
  namespace: feature-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: feature-dashboard
rules:
  - apiGroups: [""]
    resources: [namespaces, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete] # delete: Aktion delete-pod
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: feature-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: feature-dashboard
subjects:
  - kind: ServiceAccount
    name: feature-dashboard
    namespace: feature-dashboard
