apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-dashboard
  namespace: feature-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: feature-dashboard
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, patch] # patch: Aktion assign-team (Team-Label am Namespace)
  - apiGroups: [""]
    resources: [services]
    # create: Aktion node-port-service-on-service-base, delete: Aktion delete-node-port-service
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete] # delete: Aktion delete-pod
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: feature-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: feature-dashboard
subjects:
  - kind: ServiceAccount
    name: feature-dashboard
    namespace: feature-dashboard
