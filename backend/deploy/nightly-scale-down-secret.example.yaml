# Beispiel: Trigger-Token für die Pipeline des nächtlichen Herunterskalierens (CronJob nightly-scale-down).
# Wird per envFrom als Umgebungsvariable geladen. Echte Tokens nicht ins Repository committen.
apiVersion: v1
kind: Secret
metadata:
  name: nightly-scale-down-gitlab
  namespace: feature-dashboard
type: Opaque
stringData:
  GITLAB_TRIGGER_TOKEN: "<pipeline-trigger-token>"
